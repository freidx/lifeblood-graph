name: fetch-blood-levels
on:
  schedule:
    - cron: "5 20 * * *" # 20:05 UTC (06:05am as of October)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python fetch.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs/history.csv
          git diff --cached --quiet || git commit -m "Update levels"
          git push
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/lifeblood-graph/favicon.ico" sizes="any">
  <title>Lifeblood Levels (AU)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --red: #ff1f2f;
      --muted: #8c8c8c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font: 16px/1.5 system-ui, sans-serif;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0;
      text-align: center;
    }

    h2 {
      font-size: 1.1rem;
      margin: 0 0 .75rem;
      text-align: center;
    }

    h2 b {
      color: var(--red);
      font-size: 1.5rem;
      margin-left: .5rem;
    }

    .muted {
      color: var(--muted);
      font-size: .9rem;
      margin: -.75rem 0 .5rem;
      text-align: center;
    }

    .card {
      background: #0e0e0e;
      border: 1px solid #262626;
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }

    .chart {
      position: relative;
      flex: 1;
      min-height: 260px;
    }

    .drops {
      display: grid;
      grid-template-columns: repeat(4, 64px);
      justify-content: center;
      gap: .75rem 1rem;
      margin-bottom: 1rem;
    }

    .drop {
      width: 64px;
      text-align: center;
      line-height: 1.2;
    }

    .drop svg {
      width: 36px;
      height: 36px;
      margin: 0 auto;
      display: block;
    }

    .drop b,
    .drop span {
      display: block;
    }

    .drop span {
      color: var(--muted);
      font-size: .75rem;
    }

    @media (min-width: 800px) {
      main {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      h1,
      #updated {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Lifeblood Levels (AU)</h1>
    <p id="updated" class="muted">Loading…</p>
    <section class="card">
      <div class="drops" id="drops"></div>
      <div class="chart"><canvas id="levels"></canvas></div>
    </section>
    <section class="card">
      <h2>Plasma <b id="plasma"></b></h2>
      <div class="chart"><canvas id="plasmaChart"></canvas></div>
    </section>
  </main>
  <p class="muted">site not associated with lifeblood.com.au</p>

  <script>
    // note: there's also plasma.appeal-mode, .need-more .okay and .good styles, currently just using public %, 100% isn't full drop though so 125-150% to be "full"?
    // the slightly annoying thing is that plasma with a style good is good label but blood with a style good is great lol, they look the exact same

    // labels guessed from classes, hence WIP
    // great is good but sometimes good is good and great can't be great ;-)
    // might be worth considering using classes instead, though their "great" and "full" differed
    // I doubt empty and full can be achieved, did not see it happen in wayback
    // guessing based on styles
    //                V                                                                V        V
    const LEVELS = ["empty", "critical", "urgent", "low", "need more", "ok", "good", "great", "full"];
    const SHADES = ["#3a3a3a", "#ff9a9a", "#ff6666", "#ff4040", "#ff2a2a", "#f01020", "#e00018"];
    const LINES = ["#ff2b2b", "#ffffff", "#ff8a8a", "#9a9a9a", "#c40000", "#ffd0d0", "#666666", "#ff5757"];
    const DROP = "M12 2C12 2 4.5 10.5 4.5 15.5a7.5 7.5 0 0 0 15 0C19.5 10.5 12 2 12 2z";

    const $ = id => document.getElementById(id);
    const levelOf = name => LEVELS.indexOf(name.toLowerCase());

    Object.assign(Chart.defaults, { color: "#8c8c8c", borderColor: "#222" });

    const parseCsv = text => {
      const [header, ...lines] = text.trim().split(/\r?\n/).map(line => line.split(",").map(v => v.trim()));
      return lines.map(values => Object.fromEntries(header.map((column, i) => [column, values[i]])));
    };

    const dropSvg = ({ type, level }, n) => {
      const i = Math.max(levelOf(level), 0);
      const fill = 22 * i / 6;
      return `<div class="drop">
        <svg viewBox="0 0 24 24" role="img" aria-label="${type} ${level}">
          <clipPath id="clip${n}"><path d="${DROP}"/></clipPath>
          <rect y="${24 - fill}" width="24" height="${fill + 2}" fill="${SHADES[i]}" clip-path="url(#clip${n})"/>
          <path d="${DROP}" fill="none" stroke="${i ? "#ff2a2a" : "#555"}" stroke-width="1.2"/>
        </svg>
        <b>${type}</b><span>${level}</span>
      </div>`;
    }

    const drawCharts = (rows, times) => {
      const time = { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" };
      const labels = times.map(t => new Date(t).toLocaleString([], time));

      const series = (type, read) => times.map(t => {
        const row = rows.find(r => r.timestamp === t && r.type === type);
        const value = row ? read(row) : NaN;
        return Number.isNaN(value) || value < 0 ? null : value;
      });

      const types = [...new Set(rows.map(r => r.type))].filter(t => t !== "Plasma");
      const bloodTypes = types.map((type, i) => ({
        label: type, data: series(type, r => levelOf(r.level)), stepped: true, pointRadius: 2,
        borderColor: LINES[i % LINES.length], backgroundColor: LINES[i % LINES.length],
      }));
      const plasma = [{
        data: series("Plasma", r => parseFloat(r.percent)), tension: .25, pointRadius: 2,
        fill: true, borderColor: "#ff1f2f", backgroundColor: "rgba(255,31,47,.15)",
      }];

      new Chart($("levels"), {
        type: "line", data: { labels, datasets: bloodTypes }, options: {
          maintainAspectRatio: false,
          plugins: { legend: { labels: { boxWidth: 10 } } },
          scales: { y: { min: 0, max: 6, ticks: { stepSize: 1, callback: v => LEVELS[v] } } },
        }
      });

      new Chart($("plasmaChart"), {
        type: "line", data: { labels, datasets: plasma }, options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { ticks: { callback: v => v + "%" } } },
        }
      });
    }

    async function main() {
      const rows = parseCsv(await (await fetch("history.csv?" + Date.now())).text());
      if (!rows.length) return void ($("updated").textContent = "No data yet.");

      const times = [...new Set(rows.map(r => r.timestamp))].sort();
      const latest = rows.filter(r => r.timestamp === times.at(-1));
      $("updated").textContent = "Updated " + new Date(times.at(-1)).toLocaleString();
      $("drops").innerHTML = latest.filter(r => r.type !== "Plasma").map(dropSvg).join("");

      const plasma = parseFloat(latest.find(r => r.type === "Plasma")?.percent);
      $("plasma").textContent = Number.isNaN(plasma) ? "" : plasma.toFixed(1) + "%";
      drawCharts(rows, times);
    }
    main().catch(err => { $("updated").textContent = "Couldn't load history.csv: " + err.message; });

  </script>
</body>

</html>
